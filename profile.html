<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieXtream | Profile</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: #050505;
            --accent: #00e5ff;
            --accent-glow: rgba(0, 229, 255, 0.4);
            --glass: rgba(5, 5, 5, 0.8);
            --glass-card: rgba(255, 255, 255, 0.05);
            --border: rgba(0, 229, 255, 0.2);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --danger: #ff2d55;
            --success: #00ff88;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: var(--bg);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        body::before {
            content: ''; position: fixed; inset: 0;
            background-image: radial-gradient(var(--accent-glow), rgba(0, 229, 255, .05) 1px, transparent 1px);
            background-size: 40px 40px; opacity: 0.15; z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 30px 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            margin-top: 20px;
        }

        .profile-header { text-align: center; margin-bottom: 30px; }
        .profile-icon {
            font-size: 50px;
            color: var(--accent);
            background: var(--glass-card);
            width: 90px; height: 90px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; border: 2px solid var(--border);
            margin: 0 auto 15px;
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .profile-header h1 { font-size: 22px; margin: 0; letter-spacing: 1px; color: var(--accent); }
        .profile-header p { font-size: 14px; color: var(--text-dim); margin-top: 5px; }

        /* Subscription Section */
        .sub-card {
            background: var(--glass-card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 15px;
            margin-bottom: 25px;
        }
        .sub-label { font-size: 11px; text-transform: uppercase; color: var(--accent); font-weight: 800; display: block; margin-bottom: 8px; }
        .sub-detail { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 14px; }
        .sub-val { font-weight: 600; color: var(--text-main); }
        .no-sub { text-align: center; color: var(--text-dim); font-size: 13px; padding: 10px 0; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 8px; color: var(--text-dim); font-weight: 600; }
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--accent); font-size: 14px; }
        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 15px 12px 45px;
            color: white; font-size: 14px; transition: 0.3s;
        }
        input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            text-transform: uppercase;
        }
        .btn-update { background: var(--accent); color: #000; box-shadow: 0 4px 15px var(--accent-glow); }
        .btn-logout { background: transparent; border: 1px solid var(--danger); color: var(--danger); margin-top: 15px; }
        .btn:active { transform: scale(0.97); }

        .status-msg {
            margin-top: 15px; padding: 10px; border-radius: 8px; font-size: 13px; text-align: center;
            border: 1px solid transparent; display: none;
        }

        /* Modal */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-content {
            background: var(--bg); width: 85%; max-width: 320px;
            padding: 25px; border-radius: 20px; border: 1px solid var(--border); text-align: center;
        }
        .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
        .m-btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; }
        .m-confirm { background: var(--danger); color: white; }
        .m-cancel { background: var(--glass-card); color: white; border: 1px solid var(--border); }
    </style>
</head>
<body>

<div class="container">
    <div class="profile-header">
        <div class="profile-icon"><i class="fas fa-user-shield"></i></div>
        <h1>Security Center</h1>
        <p id="userEmail">Loading account...</p>
    </div>

    <div class="sub-card" id="subscriptionBox">
        <span class="sub-label"><i class="fas fa-crown"></i> Membership Status</span>
        <div id="subContent">
            <div class="no-sub">Checking subscription...</div>
        </div>
    </div>

    <div class="form-group">
        <label>New Password</label>
        <div class="input-wrapper">
            <i class="fas fa-lock"></i>
            <input type="password" id="newPassword" placeholder="Minimum 6 characters">
        </div>
    </div>

    <div class="form-group">
        <label>Confirm Password</label>
        <div class="input-wrapper">
            <i class="fas fa-check-double"></i>
            <input type="password" id="confirmPassword" placeholder="Repeat new password">
        </div>
    </div>

    <button class="btn btn-update" onclick="updatePassword()">
        <i class="fas fa-sync-alt"></i> Update Password
    </button>

    <button class="btn btn-logout" onclick="logoutUser()">
        <i class="fas fa-power-off"></i> Logout
    </button>

    <div id="statusMsg" class="status-msg"></div>
</div>

<div id="logoutModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0">Logout?</h3>
        <p style="color:var(--text-dim); font-size:14px">Are you sure you want to end your session?</p>
        <div class="modal-btns">
            <button class="m-btn m-cancel" onclick="closeModal()">Cancel</button>
            <button class="m-btn m-confirm" onclick="confirmLogout()">Logout</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyBW6mwoDVbGn0cX7ySV49648jSrLZ_vyEQ", 
        authDomain: "leoxtream-46cdf.firebaseapp.com", 
        projectId: "leoxtream-46cdf", 
        appId: "1:198227069591:web:a86310e5dc58b845abf7d2",
        databaseURL: "https://fnh-fast-vip-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('userEmail').innerText = user.email;
            fetchSubscription(user.uid);
        } else {
            window.location.href = "login.html";
        }
    });

    async function fetchSubscription(uid) {
        const subBox = document.getElementById('subContent');
        try {
            const doc = await db.collection('users').doc(uid).get();
            if (doc.exists && doc.data().subscription) {
                const sub = doc.data().subscription;
                subBox.innerHTML = `
                    <div class="sub-detail"><span>Plan:</span><span class="sub-val" style="color:var(--accent)">${sub.planName}</span></div>
                    <div class="sub-detail"><span>Started:</span><span class="sub-val">${sub.invoiceDate}</span></div>
                    <div class="sub-detail"><span>Expires:</span><span class="sub-val" style="color:var(--success)">${sub.expireDate}</span></div>
                `;
            } else {
                subBox.innerHTML = `
                    <div class="no-sub">No active subscription found.</div>
                    <button class="btn btn-update" style="margin-top:10px; font-size:11px; padding:8px" onclick="location.href='subscribe.html'">Upgrade Now</button>
                `;
            }
        } catch (error) {
            console.error("Error fetching sub:", error);
            subBox.innerHTML = `<div class="no-sub">Unable to load details.</div>`;
        }
    }

    async function updatePassword() {
        const user = auth.currentUser;
        const newPass = document.getElementById('newPassword').value;
        const confirmPass = document.getElementById('confirmPassword').value;

        if (newPass.length < 6) {
            showStatus("Password must be at least 6 characters.", "var(--danger)");
            return;
        }
        if (newPass !== confirmPass) {
            showStatus("Passwords do not match!", "var(--danger)");
            return;
        }

        try {
            await user.updatePassword(newPass);
            showStatus("Password updated successfully!", "var(--success)");
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
        } catch (error) {
            if (error.code === 'auth/requires-recent-login') {
                showStatus("Please re-login to change password.", "var(--danger)");
            } else {
                showStatus(error.message, "var(--danger)");
            }
        }
    }

    function logoutUser() {
        document.getElementById('logoutModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('logoutModal').style.display = 'none';
    }

    function confirmLogout() {
        auth.signOut();
    }

    function showStatus(text, color) {
        const statusMsg = document.getElementById('statusMsg');
        statusMsg.innerText = text;
        statusMsg.style.color = color;
        statusMsg.style.borderColor = color;
        statusMsg.style.display = "block";
    }

    window.addEventListener('popstate', function (event) {
        window.location.href = "index.html";
    });
</script>

</body>
</html>
