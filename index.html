<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vora Creator Studio</title>
    <style>
        /* Native Android Material Design + Dark Mode */
        :root {
            --android-bg: #121212;
            --android-surface: #1E1E1E;
            --android-primary: #BB86FC; /* Material Dark Purple */
            --android-secondary: #03DAC6; /* Material Teal */
            --text-primary: #FFFFFF;
            --text-secondary: #B3B3B3;
            --ripple-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Roboto, 'Segoe UI', sans-serif;
            user-select: none; /* Prevents text selection like a real app */
            -webkit-tap-highlight-color: transparent; /* Removes web click highlights */
        }

        body {
            background-color: var(--android-bg);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Native Android App Bar (Header) */
        header {
            background-color: var(--android-surface);
            height: 56px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            box-shadow: 0 4px 5px rgba(0,0,0,0.2);
            z-index: 10;
        }

        .app-title {
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 0.15px;
        }

        /* Fragment Container */
        .fragment-container {
            flex: 1;
            width: 100%;
            border: none;
            background-color: var(--android-bg);
        }

        /* Native Material Bottom Navigation */
        nav {
            background-color: var(--android-surface);
            height: 80px; /* Accounts for Android gesture navigation bar */
            display: flex;
            justify-content: space-around;
            padding-top: 8px;
            padding-bottom: 16px;
            box-shadow: 0 -1px 5px rgba(0,0,0,0.2);
            z-index: 10;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 64px;
            height: 48px;
            border-radius: 8px;
            color: var(--text-secondary);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--android-primary);
        }

        .nav-item.active .icon-container {
            background-color: rgba(187, 134, 252, 0.15); /* Active pill background */
            border-radius: 16px;
            padding: 4px 16px;
        }

        .nav-icon {
            font-size: 24px;
            margin-bottom: 2px;
            transition: all 0.2s ease-in-out;
        }

        .nav-label {
            font-size: 12px;
            font-weight: 500;
        }

        /* Android Ripple Effect */
        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            background-color: var(--ripple-color);
        }

        @keyframes ripple-animation {
            to { transform: scale(4); opacity: 0; }
        }
    </style>
</head>
<body>

    <header>
        <div class="app-title">Vora Studio</div>
    </header>

    <iframe id="fragment-frame" class="fragment-container" src="script.html"></iframe>

    <nav>
        <div class="nav-item active" onclick="switchFragment(event, 'script.html', this)">
            <div class="icon-container"><div class="nav-icon">✍️</div></div>
            <div class="nav-label">Scripts</div>
        </div>
        <div class="nav-item" onclick="switchFragment(event, 'tags.html', this)">
            <div class="icon-container"><div class="nav-icon">#️⃣</div></div>
            <div class="nav-label">Tags</div>
        </div>
        <div class="nav-item" onclick="switchFragment(event, 'bio.html', this)">
            <div class="icon-container"><div class="nav-icon">🔗</div></div>
            <div class="nav-label">Bio Link</div>
        </div>
    </nav>

    <script>
        function switchFragment(event, filename, element) {
            // Android Ripple Effect Logic
            createRipple(event, element);

            // Update Active UI State
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            element.classList.add('active');

            // Swap the iframe source to load the new HTML fragment
            document.getElementById('fragment-frame').src = filename;
        }

        function createRipple(event, element) {
            const circle = document.createElement('span');
            const diameter = Math.max(element.clientWidth, element.clientHeight);
            const radius = diameter / 2;

            const rect = element.getBoundingClientRect();
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${event.clientX - rect.left - radius}px`;
            circle.style.top = `${event.clientY - rect.top - radius}px`;
            circle.classList.add('ripple');

            const ripple = element.querySelector('.ripple');
            if (ripple) { ripple.remove(); }
            element.appendChild(circle);
        }
    </script>
</body>
</html>
