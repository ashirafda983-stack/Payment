<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Noor Quest | Barakah Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-container">
        <header class="glass-header">
            <div class="user-stats">
                <span class="label">Barakah Points</span>
                <span id="user-points" class="neon-text-gold">1,250</span>
            </div>
            <div class="global-progress-container">
                <div class="progress-label">Global Goal: Water Well ($500)</div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 65%;"></div>
                </div>
            </div>
        </header>

        <main id="main-content">
            <section id="view-home" class="view active">
                <h2 class="section-title">Daily Deeds</h2>
                <div class="task-card glass">
                    <div class="task-info">
                        <h3>Fajr Prayer</h3>
                        <p>+50 Points</p>
                    </div>
                    <button class="check-btn" onclick="completeTask(this, 50)">✓</button>
                </div>
                <div class="task-card glass">
                    <div class="task-info">
                        <h3>Morning Dhikr</h3>
                        <p>+30 Points</p>
                    </div>
                    <button class="check-btn" onclick="completeTask(this, 30)">✓</button>
                </div>
            </section>

            <section id="view-dhikr" class="view">
                <div class="counter-container glass-circle" onclick="incrementDhikr()">
                    <span class="dhikr-label">SubhanAllah</span>
                    <h1 id="dhikr-count">0</h1>
                    <span class="tap-hint">Tap to Count</span>
                </div>
                <button class="reset-btn" onclick="resetDhikr()">Reset</button>
            </section>
        </main>

        <nav class="bottom-nav glass">
            <button class="nav-item active" onclick="switchView('view-home')">Quest</button>
            <button class="nav-item" onclick="switchView('view-dhikr')">Dhikr</button>
            <button class="nav-item" onclick="switchView('view-impact')">Impact</button>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
</html>
