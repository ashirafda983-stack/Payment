<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0a0a0c; color: #fff; font-family: 'Inter', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
        }
        .quran-text { font-family: 'Amiri', serif; font-size: 1.8rem; line-height: 3rem; }
    </style>
</head>
<body class="p-4">
    <div id="app" class="max-w-md mx-auto">
        <header class="mb-6">
            <h1 class="text-2xl font-bold text-cyan-400">Quran Premium</h1>
            <p class="text-gray-400 text-sm">Juz & Yasarna Explorer</p>
        </header>

        <div class="flex gap-2 mb-6">
            <button onclick="loadJuz(1)" class="glass px-4 py-2 flex-1">Juz 1</button>
            <button onclick="loadYasarna()" class="glass px-4 py-2 flex-1">Yasarna</button>
        </div>

        <div id="content" class="glass p-6 min-h-[400px] text-right dir-rtl">
            <p class="text-gray-500 text-center mt-20">Select a section to begin</p>
        </div>
    </div>

    <script>
        async function loadJuz(id) {
            const content = document.getElementById('content');
            content.innerHTML = "Loading...";
            // Calling the Al Quran Cloud API
            const res = await fetch(`https://api.alquran.cloud/v1/juz/${id}/quran-uthmani`);
            const data = await res.json();
            
            let html = '';
            data.data.ayahs.forEach(ayah => {
                html += `<p class="quran-text mb-4">${ayah.text} <span class="text-cyan-500 text-sm">[${ayah.numberInSurah}]</span></p>`;
            });
            content.innerHTML = html;
        }
    </script>
</body>
</html>
