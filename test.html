<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mecha-Glass AI Workspace</title>
    <style>
        :root {
            --glass-bg: rgba(15, 23, 42, 0.65);
            --glass-border: rgba(0, 255, 255, 0.2);
            --neon-accent: #00f3ff;
            --text-main: #e2e8f0;
            --bg-dark: #050b14;
            --error-red: #ff4757;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 255, 255, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 100, 255, 0.05), transparent 25%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Mecha-Glass Container */
        .workspace {
            display: flex;
            width: 100vw;
            height: 100vh;
            padding: 1rem;
            gap: 1rem;
        }

        .panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Left Panel - Control Center */
        .control-center {
            width: 380px;
            flex-shrink: 0;
        }

        .header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--neon-accent);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }

        /* API Key Config Area */
        .config-area {
            padding: 1rem;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
        }

        .config-area input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            color: var(--text-main);
            padding: 0.75rem;
            outline: none;
            transition: border-color 0.3s ease;
            font-family: monospace;
        }

        .config-area input:focus {
            border-color: var(--neon-accent);
        }

        .chat-history {
            flex-grow: 1;
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            padding: 1rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid transparent;
            font-size: 0.9rem;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user {
            border-left-color: #a855f7;
        }

        .message.ai {
            border-left-color: var(--neon-accent);
        }
        
        .message.error {
            border-left-color: var(--error-red);
            color: #ffcccc;
        }

        .input-area {
            padding: 1rem;
            border-top: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-main);
            padding: 0.75rem;
            resize: none;
            outline: none;
            transition: border-color 0.3s ease;
        }

        textarea:focus {
            border-color: var(--neon-accent);
        }

        button {
            background: transparent;
            border: 1px solid var(--neon-accent);
            color: var(--neon-accent);
            padding: 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        button:hover {
            background: var(--neon-accent);
            color: #000;
            box-shadow: 0 0 15px var(--neon-accent);
        }

        button:disabled {
            border-color: #555;
            color: #555;
            cursor: not-allowed;
            box-shadow: none;
            background: transparent;
        }

        /* Right Panel - Live Render */
        .render-engine {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
        }

        .tab {
            padding: 1rem 2rem;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .tab.active {
            color: var(--neon-accent);
            border-bottom-color: var(--neon-accent);
            background: rgba(0, 243, 255, 0.05);
        }

        .view-area {
            flex-grow: 1;
            position: relative;
            display: flex;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
            flex-grow: 1;
        }

        pre {
            display: none;
            width: 100%;
            height: 100%;
            padding: 1rem;
            overflow: auto;
            background: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            flex-grow: 1;
        }

        /* Loading Overlay */
        .loader-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 11, 20, 0.8);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 1rem;
            z-index: 10;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 243, 255, 0.1);
            border-top: 3px solid var(--neon-accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="workspace">
        <div class="panel control-center">
            <div class="header">
                <div class="header-title">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--neon-accent)" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    <h1>AI Builder</h1>
                </div>
            </div>
            
            <div class="config-area">
                <input type="password" id="api-key-input" placeholder="Paste Gemini API Key here..." autocomplete="off">
            </div>

            <div class="chat-history" id="chat-history">
                <div class="message ai">System initialized. Awaiting API Key and parameters to generate application architecture.</div>
            </div>

            <div class="input-area">
                <textarea id="prompt-input" placeholder="Describe the web app you want to build... (e.g., 'A pomodoro timer with dark mode')"></textarea>
                <button id="generate-btn" onclick="generateApp()">Execute Build</button>
            </div>
        </div>

        <div class="panel render-engine">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('preview')" id="tab-preview">Live Preview</div>
                <div class="tab" onclick="switchTab('code')" id="tab-code">Raw Code</div>
            </div>

            <div class="view-area">
                <div class="loader-overlay" id="loader">
                    <div class="spinner"></div>
                    <div style="color: var(--neon-accent); font-family: monospace;" id="loader-text">COMPILING GENERATIVE CODE...</div>
                </div>
                <iframe id="preview-frame" sandbox="allow-scripts allow-same-origin"></iframe>
                <pre id="code-view"><code></code></pre>
            </div>
        </div>
    </div>

    <script>
        // --- DOM ELEMENTS ---
        const apiKeyInput = document.getElementById('api-key-input');
        const promptInput = document.getElementById('prompt-input');
        const generateBtn = document.getElementById('generate-btn');
        const chatHistory = document.getElementById('chat-history');
        const previewFrame = document.getElementById('preview-frame');
        const codeView = document.getElementById('code-view');
        const loader = document.getElementById('loader');

        // --- CORE LOGIC ---
        async function generateApp() {
            const apiKey = apiKeyInput.value.trim();
            const prompt = promptInput.value.trim();
            
            // Validation
            if (!apiKey) {
                addMessage("Authentication Error: Please provide a valid Gemini API Key in the config bar above.", "error");
                return;
            }
            if (!prompt) {
                addMessage("Input Error: Please describe the application you want to build.", "error");
                return;
            }

            // Update UI State
            addMessage(prompt, 'user');
            promptInput.value = '';
            generateBtn.disabled = true;
            loader.style.display = 'flex';

            try {
                // Using gemini-1.5-pro for complex coding tasks
                const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${apiKey}`;
                
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `You are an expert, automated web developer system. 
                                Build a complete, responsive, single-file HTML web application based on this exact user request: "${prompt}".
                                
                                STRICT SYSTEM RULES:
                                1. Output ONLY the raw, functional HTML code. 
                                2. Include all CSS within <style> tags in the <head>.
                                3. Include all JavaScript within <script> tags at the end of the <body>.
                                4. Ensure the design is modern, interactive, and fully functional out of the box.
                                5. DO NOT include greetings, explanations, or any conversational text. ONLY output the code.`
                            }]
                        }],
                        generationConfig: {
                            temperature: 0.2, 
                        }
                    })
                });

                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error?.message || "Failed to connect to Gemini API.");
                }

                const rawContent = data.candidates[0].content.parts[0].text;
                const cleanCode = extractHTML(rawContent);

                renderApp(cleanCode);
                addMessage("Build successful. Code compiled and rendered in preview pane.", 'ai');

            } catch (error) {
                console.error('Generation Error:', error);
                addMessage(`System Error: ${error.message}`, 'error');
            } finally {
                generateBtn.disabled = false;
                loader.style.display = 'none';
            }
        }

        // --- UTILITIES ---

        // Extract code from Markdown formatting if the AI includes it
        function extractHTML(text) {
            // Check for ```html ... ``` block
            const htmlMatch = text.match(/```html\s*([\s\S]*?)\s*```/i);
            if (htmlMatch) return htmlMatch[1];
            
            // Check for generic ``` ... ``` block
            const genericMatch = text.match(/```\s*([\s\S]*?)\s*```/i);
            if (genericMatch) return genericMatch[1];
            
            // If no markdown formatting is found, return the raw text
            return text.trim();
        }

        function renderApp(htmlCode) {
            // Update Iframe
            const iframeDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;
            iframeDoc.open();
            iframeDoc.write(htmlCode);
            iframeDoc.close();

            // Update Code View (escaping HTML for safe display)
            codeView.querySelector('code').textContent = htmlCode;
        }

        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.textContent = text;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function switchTab(view) {
            document.getElementById('tab-preview').classList.remove('active');
            document.getElementById('tab-code').classList.remove('active');
            
            if (view === 'preview') {
                document.getElementById('tab-preview').classList.add('active');
                previewFrame.style.display = 'block';
                codeView.style.display = 'none';
            } else {
                document.getElementById('tab-code').classList.add('active');
                previewFrame.style.display = 'none';
                codeView.style.display = 'block';
            }
        }
    </script>
</body>
</html>
