<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mecha-Glass AI Workspace</title>
    <style>
        :root {
            --glass-bg: rgba(15, 23, 42, 0.65);
            --glass-border: rgba(0, 255, 255, 0.2);
            --neon-accent: #00f3ff;
            --text-main: #e2e8f0;
            --bg-dark: #050b14;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 255, 255, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 100, 255, 0.05), transparent 25%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Mecha-Glass Container */
        .workspace {
            display: flex;
            width: 100vw;
            height: 100vh;
            padding: 1rem;
            gap: 1rem;
        }

        .panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Left Panel - Control Center */
        .control-center {
            width: 350px;
            flex-shrink: 0;
        }

        .header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--neon-accent);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }

        .chat-history {
            flex-grow: 1;
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            padding: 1rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid transparent;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .message.user {
            border-left-color: #a855f7;
        }

        .message.ai {
            border-left-color: var(--neon-accent);
        }

        .input-area {
            padding: 1rem;
            border-top: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-main);
            padding: 0.75rem;
            resize: none;
            outline: none;
            transition: border-color 0.3s ease;
        }

        textarea:focus {
            border-color: var(--neon-accent);
        }

        button {
            background: transparent;
            border: 1px solid var(--neon-accent);
            color: var(--neon-accent);
            padding: 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        button:hover {
            background: var(--neon-accent);
            color: #000;
            box-shadow: 0 0 15px var(--neon-accent);
        }

        button:disabled {
            border-color: #555;
            color: #555;
            cursor: not-allowed;
            box-shadow: none;
            background: transparent;
        }

        /* Right Panel - Live Render */
        .render-engine {
            flex-grow: 1;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
        }

        .tab {
            padding: 1rem 2rem;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .tab.active {
            color: var(--neon-accent);
            border-bottom-color: var(--neon-accent);
            background: rgba(0, 243, 255, 0.05);
        }

        .view-area {
            flex-grow: 1;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff; /* White background for the generated web app */
        }

        pre {
            display: none;
            width: 100%;
            height: 100%;
            padding: 1rem;
            overflow: auto;
            background: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
        }

        /* Loading Overlay */
        .loader-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 11, 20, 0.8);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 1rem;
            z-index: 10;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 243, 255, 0.1);
            border-top: 3px solid var(--neon-accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="workspace">
        <div class="panel control-center">
            <div class="header">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--neon-accent)" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                <h1>AI Builder</h1>
            </div>
            
            <div class="chat-history" id="chat-history">
                <div class="message ai">System initialized. Awaiting parameters to generate application architecture.</div>
            </div>

            <div class="input-area">
                <textarea id="prompt-input" placeholder="Describe the web app you want to build..."></textarea>
                <button id="generate-btn" onclick="generateApp()">Execute Build</button>
            </div>
        </div>

        <div class="panel render-engine">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('preview')" id="tab-preview">Live Preview</div>
                <div class="tab" onclick="switchTab('code')" id="tab-code">Raw Code</div>
            </div>

            <div class="view-area">
                <div class="loader-overlay" id="loader">
                    <div class="spinner"></div>
                    <div style="color: var(--neon-accent); font-family: monospace;">COMPILING GENERATIVE CODE...</div>
                </div>
                <iframe id="preview-frame"></iframe>
                <pre id="code-view"><code></code></pre>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        // Replace this with your actual Gemini API Key securely when deploying
        const GEMINI_API_KEY = 'YOUR_GEMINI_API_KEY_HERE'; 
        
        // --- DOM ELEMENTS ---
        const promptInput = document.getElementById('prompt-input');
        const generateBtn = document.getElementById('generate-btn');
        const chatHistory = document.getElementById('chat-history');
        const previewFrame = document.getElementById('preview-frame');
        const codeView = document.getElementById('code-view');
        const loader = document.getElementById('loader');

        // --- CORE LOGIC ---
        async function generateApp() {
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            // Update UI
            addMessage(prompt, 'user');
            promptInput.value = '';
            generateBtn.disabled = true;
            loader.style.display = 'flex';

            try {
                // Constructing the request to Gemini API
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `You are an expert web developer system. 
                                Build a complete, responsive, single-file HTML web application based on the following request: "${prompt}".
                                RULES:
                                1. Output ONLY raw HTML code. Do not use markdown code blocks (\`\`\`html).
                                2. Include all CSS within <style> tags in the <head>.
                                3. Include all JavaScript within <script> tags at the end of the <body>.
                                4. Ensure the design is modern and functional.
                                5. Do not include any conversational text before or after the code.`
                            }]
                        }],
                        generationConfig: {
                            temperature: 0.2, // Low temperature for precise code generation
                        }
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                let generatedCode = data.candidates[0].content.parts[0].text;

                // Strip markdown formatting if the AI accidentally includes it despite instructions
                generatedCode = generatedCode.replace(/^```html\n?/i, '').replace(/^```\n?/i, '').replace(/```$/i, '').trim();

                // Inject code into Iframe for live preview
                const iframeDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;
                iframeDoc.open();
                iframeDoc.write(generatedCode);
                iframeDoc.close();

                // Update Code View
                codeView.querySelector('code').textContent = generatedCode;

                addMessage("Build successful. Code rendered in preview pane.", 'ai');

            } catch (error) {
                console.error('Generation Error:', error);
                addMessage(`System Error: ${error.message}`, 'ai');
            } finally {
                generateBtn.disabled = false;
                loader.style.display = 'none';
                chatHistory.scrollTop = chatHistory.scrollHeight;
            }
        }

        // --- UTILS ---
        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.textContent = text;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function switchTab(view) {
            document.getElementById('tab-preview').classList.remove('active');
            document.getElementById('tab-code').classList.remove('active');
            
            if (view === 'preview') {
                document.getElementById('tab-preview').classList.add('active');
                previewFrame.style.display = 'block';
                codeView.style.display = 'none';
            } else {
                document.getElementById('tab-code').classList.add('active');
                previewFrame.style.display = 'none';
                codeView.style.display = 'block';
            }
        }
    </script>
</body>
</html>
