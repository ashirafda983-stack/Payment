<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pearlpix | Details</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <style>
        :root { --bg: #050505; --accent: #00e5ff; --glass: rgba(5, 5, 5, 0.8); --border: rgba(0, 229, 255, 0.3); --text-main: #f8fafc; --text-dim: #94a3b8; --plyr-color-main: #00e5ff; }
        body { background: var(--bg); margin: 0; color: var(--text-main); font-family: 'Segoe UI', sans-serif; overflow-x: hidden; padding-top: 56.25vw; }
        .back-btn { position: fixed; top: 20px; left: 20px; z-index: 1000; background: var(--glass); width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); backdrop-filter: blur(10px); color: white; }
        
        .mini-player-container { position: fixed; top: 0; left: 0; width: 100%; height: 56.25vw; background: black; z-index: 900; box-shadow: 0 10px 30px rgba(0, 229, 255, 0.4); overflow: hidden; }
        
        /* Updated: Restrict landscape fullscreen to mobile phones only so it doesn't break desktops */
        @media screen and (max-width: 767px) and (orientation: landscape) { .mini-player-container { height: 100vh; } body { padding-top: 0; } }

        .plyr { height: 100% !important; }
        .mini-player-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center; position: relative; }
        .mini-player-placeholder::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.5); }
        
        .play-icon-central { font-size: 60px; color: var(--accent); z-index: 10; position: relative; filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.5)); cursor: pointer; animation: pulsePlay 2s infinite; transition: transform 0.2s; }
        @keyframes pulsePlay { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }

        .player-loader-circle { position: absolute; top: 50%; left: 50%; margin-top: -30px; margin-left: -30px; width: 60px; height: 60px; border: 5px solid rgba(255,255,255,0.1); border-top: 5px solid var(--accent); border-radius: 50%; z-index: 1005; animation: spinLoader 1s linear infinite; display: none; pointer-events: none; box-shadow: 0 0 15px rgba(0, 229, 255, 0.5); }
        @keyframes spinLoader { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #next-ep-btn { position: absolute; bottom: 80px; right: 20px; background: var(--accent); color: white; padding: 8px 15px; border-radius: 5px; font-size: 12px; font-weight: bold; z-index: 1006; display: none; cursor: pointer; border: none; box-shadow: 0 0 10px rgba(0,0,0,0.5); }

        .seek-overlay { position: absolute; top: 0; bottom: 0; width: 30%; display: flex; align-items: center; justify-content: center; color: white; font-size: 30px; opacity: 0; pointer-events: none; background: rgba(255, 255, 255, 0.1); z-index: 1001; transition: opacity 0.3s; }
        .seek-left { left: 0; border-radius: 0 100px 100px 0; }
        .seek-right { right: 0; border-radius: 100px 0 0 100px; }

        .content-wrap { padding: 20px; position: relative; z-index: 5; background: var(--bg); }
        .meta-info-row { display: flex; align-items: center; gap: 15px; color: var(--text-dim); font-size: 13px; margin-bottom: 15px; flex-wrap: nowrap; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
        .meta-info-row::-webkit-scrollbar { display: none; }
        .imdb-tag { background: #121212; color: var(--accent); font-weight: 800; padding: 3px 8px; border-radius: 4px; font-size: 11px; }
        .meta-dot { width: 5px; height: 5px; background: #121212; border-radius: 50%; }

        .action-btns-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 25px; }
        .action-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--text-dim); cursor: pointer; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; padding: 12px 5px; transition: 0.3s; }
        .action-item:active { transform: scale(0.95); background: rgba(0, 229, 255, 0.1); }
        .action-item i { font-size: 18px; color: white; }
        .action-item span { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .action-item.active-list i { color: var(--accent); }

        .m-title { font-size: 24px; font-weight: 700; margin: 0 0 10px; color: white; }
        .vj-tag { color: var(--accent); font-size: 14px; font-weight: 800; margin-bottom: 15px; display: block; }
        .overview { line-height: 1.6; color: #cbd5e1; font-size: 14px; margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .overview.expanded { -webkit-line-clamp: unset; display: block; }
        .see-more { color: var(--accent); font-size: 12px; font-weight: bold; cursor: pointer; margin-bottom: 25px; display: inline-block; }
        .info-grid { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        .info-item-label { display: block; font-size: 10px; color: var(--accent); text-transform: uppercase; font-weight: 800; margin-bottom: 10px; }
        .cast-scroll { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; }
        .actor-card { text-align: center; min-width: 60px; }
        .actor-card img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); }
        .actor-card p { font-size: 9px; color: white; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .season-container { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 20px; scrollbar-width: none; }
        .season-btn { padding: 8px 16px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: white; border-radius: 8px; font-size: 11px; font-weight: 800; }
        .season-btn.active { background: var(--accent); border-color: var(--accent); }
        .ep-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .next-eps-btn-ui { background: #121212; padding: 10px 15px; border-radius: 5px; display: flex; align-items: center; gap: 15px; cursor: pointer; color: white; border: 1px solid rgba(255,255,255,0.05); transition: 0.2s; }
        .next-eps-btn-ui:active { transform: scale(0.95); }
        .next-eps-btn-ui i { font-size: 16px; }
        .next-eps-btn-ui span { font-weight: 800; font-size: 14px; letter-spacing: 0.5px; }
        .ep-count-text { font-weight: 700; font-size: 14px; color: white; display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .ep-list-vertical { display: flex; flex-direction: column; gap: 15px; padding-bottom: 15px; }
        .ep-card-glass { display: flex; background: rgba(5, 5, 5, 0.6); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; backdrop-filter: blur(10px); padding: 10px; gap: 12px; align-items: center; position: relative; cursor: pointer; transition: 0.3s; }
        .ep-card-glass:active { transform: scale(0.98); background: rgba(0, 229, 255, 0.1); }
        .ep-card-glass img { width: 90px; height: 130px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
        .ep-details-glass { display: flex; flex-direction: column; flex: 1; overflow: hidden; justify-content: center; }
        .ep-title-glass { font-size: 16px; font-weight: 800; color: #fff; margin: 0 0 5px 0; text-transform: uppercase; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
        .ep-desc-glass { font-size: 12px; color: #cbd5e1; margin: 0 0 10px 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.5; }
        .ep-meta-glass { display: flex; gap: 10px; font-size: 14px; font-weight: 700; align-items: center; }
        .ep-size { color: #22c55e; }
        .ep-duration { color: #94a3b8; }
        .ep-dl-btn { background: transparent; border: none; color: white; font-size: 24px; cursor: pointer; padding: 10px; display: flex; align-items: center; justify-content: center; z-index: 10; transition: color 0.3s; }
        .ep-dl-btn:active { color: var(--accent); }
        #brightness-overlay { position: absolute; inset: 0; background: black; opacity: 0; pointer-events: none; z-index: 998; transition: opacity 0.1s; }
        .player-slider-container { position: absolute; top: 50%; transform: translateY(-50%); height: 60%; width: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1002; background: rgba(0,0,0,0.5); border-radius: 20px; padding: 10px 0; backdrop-filter: blur(5px); opacity: 1; pointer-events: auto; }
        .slider-left { left: 15px; }
        .slider-right { right: 15px; }
        .player-slider-container i { color: white; margin: 10px 0; font-size: 14px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .vertical-slider { -webkit-appearance: none; width: 120px; height: 4px; background: rgba(255,255,255,0.3); outline: none; transform: rotate(-90deg); margin: 60px 0; border-radius: 2px; }
        .vertical-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); cursor: pointer; box-shadow: 0 0 10px rgba(0, 229, 255, 0.8); }
        .section-title { font-size: 16px; font-weight: 800; border-left: 3px solid var(--accent); padding-left: 10px; margin: 25px 0 15px; }
        .suggest-scroll { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 5px; }
        .suggest-card img { width: 110px; height: 170px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); transition: 0.3s; }
        .suggest-card:active img { transform: scale(0.95); border-color: var(--accent); }
        .skeleton { background: #111; animation: pulseGlow 1.5s infinite alternate; border-radius: 8px; box-shadow: inset 0 0 10px rgba(0, 229, 255, 0.2); }
        @keyframes pulseGlow { 0% { background-color: #0a0a0a; opacity: 0.6; } 100% { background-color: #1a1a1a; opacity: 1; box-shadow: inset 0 0 20px rgba(0, 229, 255, 0.4); } }
        .pearl-footer { text-align: center; padding: 30px 20px; color: var(--text-dim); font-size: 12px; border-top: 1px solid rgba(255,255,255,0.05); margin-top: 30px; }
        /* --- BRAND NEW: LAPTOP, DESKTOP & TABLET RESPONSIVE SCALING --- */
        @media screen and (min-width: 768px) {
            body { 
                padding-top: 0; /* Unfix player space to allow scrolling */
                background: #000; /* Subtle contrast */
            }
            .mini-player-container {
                position: relative; /* Keep it in doc flow for desktops */
                width: 95%;
                max-width: 1200px;
                height: 500px;
                margin: 20px auto 0 auto;
                border-radius: 12px;
                overflow: hidden;
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 229, 255, 0.1);
            }
            .content-wrap {
                max-width: 1200px;
                margin: 0 auto;
                padding: 30px 20px;
            }
            /* Convert horizontal layout items to neat wrap grids */
            .action-btns-grid {
                display: flex;
                flex-wrap: wrap;
                justify-content: flex-start;
                gap: 15px;
            }
            .action-item {
                flex-direction: row; /* Put icon next to text on larger screens */
                padding: 12px 25px;
            }
            .ep-list-vertical {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); /* Auto-arrange episodes into cards */
                gap: 20px;
            }
            .suggest-scroll, .cast-scroll {
                flex-wrap: wrap; /* Turn sliding scroller into an aesthetic wrap gallery */
                gap: 15px;
                overflow-x: visible;
            }
            .suggest-card img {
                width: 130px;
                height: 190px;
            }
        }

        @media screen and (min-width: 1024px) {
            .mini-player-container {
                height: 600px; /* Big cinema view for laptops */
                margin-top: 40px;
                border-radius: 16px;
            }
            .overview {
                max-width: 75%; /* Enhance text readability by preventing wide stretching */
                font-size: 15px;
            }
            .suggest-card img {
                width: 160px;
                height: 240px;
                border-radius: 12px;
            }
            .suggest-card:hover img, .ep-card-glass:hover {
                transform: translateY(-3px); /* Add slick hover effects for mouse users */
                box-shadow: 0 5px 15px rgba(0, 229, 255, 0.15);
            }
            .back-btn {
                width: 50px;
                height: 50px;
                font-size: 20px;
                top: 30px;
                left: 30px;
                cursor: pointer;
                transition: 0.3s;
            }
            .back-btn:hover {
                background: rgba(0, 229, 255, 0.2);
                transform: scale(1.1);
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
    <div id="trailer-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:5000; align-items:center; justify-content:center;">
        <div style="width:90%; max-width:800px; position:relative;">
            <div onclick="closeTrailer()" style="position:absolute; top:-40px; right:0; color:white; cursor:pointer;">CLOSE <i class="fa-solid fa-xmark"></i></div>
            <div id="trailer-host" style="aspect-ratio:16/9; background:#000; border-radius:15px; overflow:hidden;"></div>
        </div>
    </div>

    <div class="mini-player-container" id="mini-player-host">
        <div id="seek-left" class="seek-overlay seek-left"><i class="fa-solid fa-backward"></i></div>
        <div id="seek-right" class="seek-overlay seek-right"><i class="fa-solid fa-forward"></i></div>
        <div class="player-loader-circle" id="player-loader"></div>
        <button id="next-ep-btn">NEXT EPISODE <i class="fa-solid fa-forward-step"></i></button>
        <div class="mini-player-placeholder skeleton" id="player-placeholder">
            <i class="fa-solid fa-circle-play play-icon-central" id="main-play-btn"></i>
        </div>
    </div>
    <div id="details-content">
        <div class="content-wrap">
            <div class="skeleton" style="width:60%; height:25px; margin-bottom:15px;"></div>
            <div class="skeleton" style="width:100%; height:80px; margin-bottom:15px;"></div>
        </div>
    </div>
    <script>
    const firebaseConfig = { apiKey: "AIzaSyBW6mwoDVbGn0cX7ySV49648jSrLZ_vyEQ", authDomain: "leoxtream-46cdf.firebaseapp.com", projectId: "leoxtream-46cdf", appId: "1:198227069591:web:a86310e5dc58b845abf7d2" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    firebase.auth().onAuthStateChanged(user => {
        if (user) {
            const lastUserUid = localStorage.getItem('lastUserUid');
            if (lastUserUid !== user.uid) {
                localStorage.removeItem('recentlyPlayed');
                localStorage.removeItem('continueWatching');
                localStorage.removeItem('savedMovies');
                Object.keys(localStorage).forEach(key => { if (key.startsWith('resume_')) localStorage.removeItem(key); });
            }
            localStorage.setItem('lastUserUid', user.uid);
            checkSubscriptionStatus(user); // New check on load
        } else {
            localStorage.removeItem('recentlyPlayed');
            localStorage.removeItem('continueWatching');
            localStorage.removeItem('savedMovies');
            Object.keys(localStorage).forEach(key => { if (key.startsWith('resume_')) localStorage.removeItem(key); });
            localStorage.removeItem('lastUserUid');
        }
    });

    const urlParams = new URLSearchParams(window.location.search);
    const movieId = urlParams.get('id');
    const resumeTime = urlParams.get('t');

    let pInstance;
    let currentEpIndex = 0;
    window.episodesExpanded = false;
    let isSubscribed = false; // Subscription flag

    // Function to check subscription
    function checkSubscriptionStatus(user) {
        db.collection('users').doc(user.uid).get().then(doc => {
            if (doc.exists && doc.data().subscription) {
                isSubscribed = true;
            } else {
                isSubscribed = false;
            }
        }).catch(() => { isSubscribed = false; });
    }

    // Intercept play action
    function handlePlayAction(actionCallback) {
        const user = firebase.auth().currentUser;
        if (!user) {
            window.location.href = 'login.html';
            return;
        }

        if (isSubscribed) {
            actionCallback();
        } else {
            db.collection('users').doc(user.uid).get().then(doc => {
                if (doc.exists && doc.data().subscription) {
                    isSubscribed = true;
                    actionCallback();
                } else {
                    window.location.href = 'subscribe.html';
                }
            }).catch(() => {
                window.location.href = 'subscribe.html';
            });
        }
    }

    if (movieId) {
        db.collection("movies").doc(movieId).onSnapshot(doc => { 
            if (doc.exists) { renderDetails(doc.data(), doc.id); loadSuggestions(doc.data()); } 
        });
    }

    function renderDetails(m, id) {
        window.currentMovieData = m;
        window.currentMovieId = id;
        let epList = [];
        try { epList = typeof m.Episodes === 'string' ? JSON.parse(m.Episodes) : (m.Episodes || []); } catch(e) { epList = []; }
        window.currentEpisodes = epList;

        const placeholder = document.getElementById('player-placeholder');
        placeholder.style.backgroundImage = `url(${m.banner || m.poster})`;
        placeholder.classList.remove('skeleton');

        // Play button now checks subscription
        const firstAction = epList.length > 0 
            ? () => handlePlayAction(() => startAdvancedPlayer(0))
            : () => handlePlayAction(() => startAdvancedPlayer(encodeURIComponent(m.videoUrl || m.link || ''), encodeURIComponent(m.title || '')));
        
        document.getElementById('main-play-btn').onclick = firstAction;

        const seasons = [...new Set(epList.map(ep => ep.season || 1))].sort((a,b) => a-b);
        let seasonHtml = seasons.length > 1 ? `<div class="season-container">` + seasons.map(s => `<button class="season-btn ${s==1?'active':''}" onclick="filterSeason(this, ${s})">SEASON ${s}</button>`).join('') + `</div>` : "";
        const isSeries = epList.length > 1 || m.type === "series";

        document.getElementById('details-content').innerHTML = `
            <div class="content-wrap">
                <span class="vj-tag">${(m.vj || 'Pearlpix').replace(/VJ[:\s]*/ig, '').trim()}</span>
                <h1 class="m-title">${m.title}</h1>
                <div class="meta-info-row">
                    <span class="imdb-tag">IMDB ${m.imdb || 'N/A'}</span>
                    <div class="meta-dot"></div><span>${m.year || 'N/A'}</span>
                    <div class="meta-dot"></div><span>${m.vj_genre || m.genre || 'N/A'}</span>
                    <div class="meta-dot"></div><span>${m.language || 'N/A'}</span>
                    <div class="meta-dot"></div><span>${m.duration || 'N/A'}</span>
                </div>
                <div class="action-btns-grid">
                    <div class="action-item" onclick="playTrailer('${m.trailer}')">
                        <i class="fa-solid fa-clapperboard"></i><span>Trailer</span>
                    </div>
                    <div class="action-item ${isSaved(id)?'active-list':''}" onclick="toggleSave('${id}', this)">
                        <i class="fa-solid ${isSaved(id)?'fa-check':'fa-plus'}"></i><span>My List</span>
                    </div>
                    <div class="action-item" onclick="handleDownload('${m.videoUrl || m.link}', '${m.title}')">
                        <i class="fa-solid fa-download"></i><span>Download</span>
                    </div>
                    <div class="action-item" onclick="window.location.href='contact.html'">
                        <i class="fa-solid fa-paper-plane"></i><span>Request</span>
                    </div>
                </div>
                <p class="overview">${m.overview || ''}</p>
                <span class="see-more" onclick="toggleOverview()">See More</span>
                ${!isSeries ? `<div class="info-grid"><span class="info-item-label">Cast Actors</span><div class="cast-scroll">${(m.castList || []).map(a => `<div class="actor-card"><img src="${a.img}"><p>${a.name}</p></div>`).join('')}</div></div>` : ''}
                
                ${isSeries ? `
                ${seasonHtml}
                <div class="ep-header-flex">
                    <div class="next-eps-btn-ui" onclick="handlePlayAction(() => playNext())">
                        <i class="fa-solid fa-play"></i>
                        <span>NEXT EPS</span>
                        <span id="ui-next-ep-num">2</span>
                    </div>
                    <div class="ep-count-text" onclick="toggleEpisodes()">
                        ${epList.length} EPISODES <i id="ep-toggle-icon" class="fa-solid fa-chevron-down"></i>
                    </div>
                </div>
                <div class="ep-list-vertical" id="episodes-list">${buildEpisodes(1)}</div>
                ` : ''}
                
                <div class="section-title">Related Content</div>
                <div id="suggestion-box" class="suggest-scroll"></div>
                
                <div id="extra-categories-methods"></div>

                <div class="pearl-footer">
                    &copy; ${new Date().getFullYear()} Pearlpix. All rights reserved.
                </div>
            </div>`;
        
        if (resumeTime) {
            firstAction();
        }
    }
    function filterSeason(btn, s) {
        document.querySelectorAll('.season-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('episodes-list').innerHTML = buildEpisodes(s);
    }

    function toggleEpisodes() {
        window.episodesExpanded = !window.episodesExpanded;
        const activeSeasonBtn = document.querySelector('.season-btn.active');
        const s = activeSeasonBtn ? parseInt(activeSeasonBtn.innerText.replace('SEASON ', '')) : 1;
        document.getElementById('episodes-list').innerHTML = buildEpisodes(s);
        const icon = document.getElementById('ep-toggle-icon');
        if (icon) icon.className = window.episodesExpanded ? 'fa-solid fa-chevron-up' : 'fa-solid fa-chevron-down';
    }

    function buildEpisodes(s) {
        let eps = window.currentEpisodes.filter(ep => (ep.season || 1) == s);
        if (!window.episodesExpanded && eps.length > 6) {
            eps = eps.slice(0, 6);
        }
        return eps.map((ep, i) => `
            <div class="ep-card-glass" onclick="handlePlayAction(() => startAdvancedPlayer(${window.currentEpisodes.indexOf(ep)}))">
                <img src="${ep.poster || window.currentMovieData.poster}">
                <div class="ep-details-glass">
                    <h3 class="ep-title-glass">${ep.title || 'EPS '+(i+1)}</h3>
                    <p class="ep-desc-glass">${ep.overview || window.currentMovieData.overview || 'No description available for this episode.'}</p>
                </div>
                <button class="ep-dl-btn" onclick="event.stopPropagation(); handleDownload('${ep.link}', '${ep.title || 'Episode '+(i+1)}')">
                    <i class="fa-solid fa-download"></i>
                </button>
            </div>`).join('');
    }

    function startAdvancedPlayer(indexOrLink, title) {
        let videoUrl, videoTitle;
        if(typeof indexOrLink === 'number') {
            currentEpIndex = indexOrLink;
            const ep = window.currentEpisodes[currentEpIndex];
            videoUrl = decodeURIComponent(ep.link || '');
            videoTitle = ep.title;
        } else {
            videoUrl = decodeURIComponent(indexOrLink || '');
            videoTitle = decodeURIComponent(title || '');
        }

        try {
            let history = JSON.parse(localStorage.getItem('recentlyPlayed') || "[]");
            history = history.filter(i => i !== window.currentMovieId);
            history.unshift(window.currentMovieId);
            if (history.length > 24) history.pop();
            localStorage.setItem('recentlyPlayed', JSON.stringify(history));
            
            let cwList = JSON.parse(localStorage.getItem('continueWatching') || "[]");
            cwList = cwList.filter(item => typeof item === 'object' && item !== null && item.id !== window.currentMovieId);
            cwList.unshift({
                id: window.currentMovieId,
                title: window.currentMovieData.title,
                poster: window.currentMovieData.poster || window.currentMovieData.banner,
                vj: (window.currentMovieData.vj || "").replace(/VJ[:\s]*/ig, '').trim(),
                epTitle: (typeof indexOrLink === 'number') ? (videoTitle && videoTitle !== 'undefined' ? videoTitle : null) : null
            });
            if (cwList.length > 20) cwList.pop();
            localStorage.setItem('continueWatching', JSON.stringify(cwList));
            if (!localStorage.getItem('resume_' + window.currentMovieId)) { localStorage.setItem('resume_' + window.currentMovieId, 11); }
        } catch(e) {}

        const titleEl = document.querySelector('.m-title');
        if (titleEl) {
            titleEl.innerText = window.currentMovieData.title + (videoTitle && videoTitle !== 'undefined' ? ' - ' + videoTitle : '');
        }
        
        const uiNextNum = document.getElementById('ui-next-ep-num');
        if (uiNextNum && window.currentEpisodes.length > currentEpIndex + 1) {
            uiNextNum.innerText = currentEpIndex + 2;
        }

        const host = document.getElementById('mini-player-host');
        host.innerHTML = `
            <div id="brightness-overlay"></div>
            <div id="seek-left" class="seek-overlay seek-left"><i class="fa-solid fa-backward"></i></div>
            <div id="seek-right" class="seek-overlay seek-right"><i class="fa-solid fa-forward"></i></div>
            
            <div id="slider-left" class="player-slider-container slider-left">
                <i class="fa-solid fa-sun"></i>
                <input type="range" min="0" max="1" step="0.01" value="1" class="vertical-slider" id="brt-slider">
            </div>
            <div id="slider-right" class="player-slider-container slider-right">
                <i class="fa-solid fa-volume-high"></i>
                <input type="range" min="0" max="1" step="0.01" value="1" class="vertical-slider" id="vol-slider">
            </div>
            <div class="player-loader-circle" id="player-loader"></div>
            <button id="next-ep-btn" onclick="handlePlayAction(() => playNext())">NEXT EPISODE <i class="fa-solid fa-forward-step"></i></button>
            <video id="player-el" playsinline controls crossorigin><source src="${videoUrl}" type="video/mp4" /></video>`;
        
        pInstance = new Plyr('#player-el', {
            controls: ['play-large', 'rewind', 'play', 'fast-forward', 'progress', 'current-time', 'mute', 'volume', 'settings', 'pip', 'fullscreen'],
            seekTime: 10,
            settings: ['quality', 'speed'],
            speed: { selected: 1, options: [0.5, 1, 1.5, 2] }
        });
        
        const plyrContainer = document.querySelector('.plyr');
        if (plyrContainer) {
            plyrContainer.appendChild(document.getElementById('brightness-overlay'));
            plyrContainer.appendChild(document.getElementById('seek-left'));
            plyrContainer.appendChild(document.getElementById('seek-right'));
            plyrContainer.appendChild(document.getElementById('slider-left'));
            plyrContainer.appendChild(document.getElementById('slider-right'));
            plyrContainer.appendChild(document.getElementById('player-loader'));
            plyrContainer.appendChild(document.getElementById('next-ep-btn'));
        }

        const vEl = document.getElementById('player-el');
        const activeLoader = document.getElementById('player-loader');
        const nextBtn = document.getElementById('next-ep-btn');
        const brtSlider = document.getElementById('brt-slider');
        const volSlider = document.getElementById('vol-slider');
        const brtOverlay = document.getElementById('brightness-overlay');

        brtSlider.addEventListener('input', (e) => {
            brtOverlay.style.opacity = 0.8 - (e.target.value * 0.8);
        });

        volSlider.addEventListener('input', (e) => {
            pInstance.volume = e.target.value;
        });

        pInstance.on('volumechange', () => {
            if(volSlider) volSlider.value = pInstance.volume;
        });

        pInstance.on('waiting', () => { activeLoader.style.display = 'block'; });
        pInstance.on('playing', () => { activeLoader.style.display = 'none'; });
        pInstance.on('canplay', () => { 
            activeLoader.style.display = 'none'; 
            if (resumeTime && typeof window.jumpedOnce === 'undefined') {
                pInstance.currentTime = parseFloat(resumeTime);
                window.jumpedOnce = true;
                pInstance.play();
            }
        });
        
        pInstance.on('timeupdate', () => {
            if (pInstance.currentTime > 5) {
                localStorage.setItem('resume_' + window.currentMovieId, pInstance.currentTime);
            }
            if(window.currentEpisodes.length > currentEpIndex + 1) {
                const remains = pInstance.duration - pInstance.currentTime;
                nextBtn.style.display = (remains < 30) ? 'block' : 'none';
            }
        });
        
        pInstance.on('ended', () => { if(window.currentEpisodes.length > currentEpIndex + 1) handlePlayAction(() => playNext()); });

        let lastTap = 0;
        vEl.addEventListener('touchend', (e) => {
            let now = new Date().getTime();
            let delta = now - lastTap;
            if (delta < 300 && delta > 0) {
                const x = e.changedTouches[0].pageX;
                if (x < window.innerWidth / 2) { pInstance.rewind(10); showFeedback('seek-left'); }
                else { pInstance.forward(10); showFeedback('seek-right'); }
            }
            lastTap = now;
        });

        pInstance.on('enterfullscreen', () => { if (window.AndroidBridge) window.AndroidBridge.forceLandscape(); });
        pInstance.on('exitfullscreen', () => { if (window.AndroidBridge) window.AndroidBridge.forcePortrait(); });
        
        addToActivity(window.currentMovieId, videoTitle);
    }

    function playNext() { if(window.currentEpisodes[currentEpIndex + 1]) startAdvancedPlayer(currentEpIndex + 1); }
    function showFeedback(id) {
        const el = document.getElementById(id);
        el.style.opacity = '1';
        setTimeout(() => { el.style.opacity = '0'; }, 500);
    }

    function playTrailer(url) {
        if(!url) return alert("No trailer available");
        const host = document.getElementById('trailer-host');
        host.innerHTML = url.includes('youtube') || url.includes('googleusercontent.com') 
            ? `<iframe src="${url.replace('watch?v=', 'embed/')}?autoplay=1" style="width:100%; height:100%; border:none;" allow="autoplay; fullscreen" allowfullscreen></iframe>` 
            : `<video controls autoplay style="width:100%; height:100%;"><source src="${url}" type="video/mp4"></video>`;
        document.getElementById('trailer-modal').style.display = 'flex';
    }

    function closeTrailer() { document.getElementById('trailer-modal').style.display = 'none'; document.getElementById('trailer-host').innerHTML = ''; }

    function toggleSave(id, btn) {
        let saved = JSON.parse(localStorage.getItem('savedMovies') || "[]");
        if (saved.includes(id)) { 
            saved = saved.filter(i => i !== id); 
            btn.querySelector('i').className = 'fa-solid fa-plus'; 
            btn.classList.remove('active-list');
        } else { 
            saved.push(id); 
            btn.querySelector('i').className = 'fa-solid fa-check'; 
            btn.classList.add('active-list');
        }
        localStorage.setItem('savedMovies', JSON.stringify(saved));
    }

    function isSaved(id) { 
        return JSON.parse(localStorage.getItem('savedMovies') || "[]").includes(id); 
    }

    function loadSuggestions(currentMovieData) {
        db.collection("movies").get().then(snap => {
            const box = document.getElementById('suggestion-box');
            const extraMethodsBox = document.getElementById('extra-categories-methods');
            box.innerHTML = '';
            extraMethodsBox.innerHTML = '';
            
            let allMovies = [];
            snap.forEach(doc => { 
                if(doc.id !== movieId) allMovies.push({id: doc.id, ...doc.data()}); 
            });
            
            // Shuffled Related Content (default)
            let shuffledSuggestions = [...allMovies].sort(() => 0.5 - Math.random());
            shuffledSuggestions.slice(0, 8).forEach(item => {
                box.innerHTML += `<div class="suggest-card" onclick="location.href='details.html?id=${item.id}'"><img src="${item.poster}"></div>`; 
            });

            // Extra categories definition based on index structure but applied dynamically
            const categoryDefinitions = [
                { title: 'Related Action', genres: ['Action', 'Adventure', 'Sci-Fi'] },
                { title: 'Related Drama', genres: ['Drama', 'Romance', 'Biography'] },
                { title: 'Related Comedy', genres: ['Comedy', 'Family', 'Animation'] },
                { title: 'Related Horror', genres: ['Horror', 'Thriller', 'Mystery'] },
                { title: 'Related Local VJ', genres: ['Luganda', 'Translated', 'VJ'] }
            ];

            // Render 5 extra dynamic category rows
            categoryDefinitions.forEach(catDef => {
                let filteredMovies = allMovies.filter(movie => {
                    const movieGenres = (movie.vj_genre || movie.genre || '').split(',').map(g => g.trim());
                    const movieLang = movie.language || '';
                    return catDef.genres.some(target => movieGenres.includes(target) || movieLang.includes(target));
                }).sort(() => 0.5 - Math.random()).slice(0, 8); // Shuffle & Limit

                if (filteredMovies.length > 0) {
                    let catHtml = `
                        <div class="section-title">${catDef.title}</div>
                        <div class="suggest-scroll">
                    `;
                    filteredMovies.forEach(item => {
                        catHtml += `<div class="suggest-card" onclick="location.href='details.html?id=${item.id}'"><img src="${item.poster}"></div>`;
                    });
                    catHtml += `</div>`;
                    extraMethodsBox.innerHTML += catHtml;
                }
            });

        });
    }

    function toggleOverview() {
        const p = document.querySelector('.overview');
        p.classList.toggle('expanded');
        document.querySelector('.see-more').innerText = p.classList.contains('expanded') ? 'Show Less' : 'See More';
    }

    // UPDATED FUNCTION: Replaces the previous simple handleDownload with an advanced in-trailer-space viewer!
    function handleDownload(link, title) {
        handlePlayAction(() => {
            if (!link) return alert("Link missing");
            const host = document.getElementById('trailer-host');
            host.innerHTML = '';
            
            if (link.includes('youtube') || link.includes('googleusercontent.com') || link.includes('embed') || link.includes('iframe')) {
                let embedLink = link.replace('watch?v=', 'embed/');
                host.innerHTML = `<iframe src="${embedLink}${embedLink.includes('?') ? '&' : '?'}autoplay=1" style="width:100%; height:100%; border:none;" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
            } else {
                host.innerHTML = `<video id="embedded-dl-player" playsinline controls autoplay crossorigin style="width:100%; height:100%;"><source src="${link}" type="video/mp4"></video>`;
                setTimeout(() => {
                    try {
                        new Plyr('#embedded-dl-player', {
                            controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'pip', 'fullscreen'],
                            settings: ['quality', 'speed'],
                            autoplay: true
                        });
                    } catch(e) {}
                }, 100);
            }
            document.getElementById('trailer-modal').style.display = 'flex';
        });
    }

    async function addToActivity(id, ep) {
        const user = firebase.auth().currentUser;
        if (user && window.currentMovieData) {
            db.collection("activity").add({
                userId: user.uid,
                movieId: id,
                title: window.currentMovieData.title,
                poster: window.currentMovieData.poster,
                vj: (window.currentMovieData.vj || "").replace(/VJ[:\s]*/ig, '').trim(),
                epTitle: ep,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
        }
    }
    </script>
</body>
