<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Movie | MovieXtream Pro</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --bg: #050505; 
            --accent: #00e5ff; 
            --card: rgba(18, 18, 18, 0.65); 
            --border: rgba(0, 229, 255, 0.3); 
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        
        body { 
            background: var(--bg); 
            background-image: radial-gradient(circle at top right, rgba(0, 229, 255, 0.08), transparent 50%),
                              radial-gradient(circle at bottom left, rgba(0, 229, 255, 0.05), transparent 50%);
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden;
        }
        
        .header { 
            padding: 15px 20px; 
            background: rgba(5, 5, 5, 0.85); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            display: flex; 
            align-items: center; 
            border-bottom: 1px solid var(--border); 
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
            z-index: 10;
        }
        .header i { font-size: 18px; cursor: pointer; margin-right: 15px; color: var(--accent); text-shadow: 0 0 10px rgba(0, 229, 255, 0.5); }
        .header div { color: var(--accent); text-shadow: 0 0 10px rgba(0, 229, 255, 0.5); letter-spacing: 1px; }

        .container { 
            flex: 1; 
            padding: 25px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            z-index: 1;
            overflow-y: auto;
        }
        
        @keyframes rotateBorder {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .request-card { 
            position: relative;
            width: 100%; 
            max-width: 400px; 
            padding: 30px; 
            border-radius: 20px; 
            text-align: center; 
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }
        
        .request-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, transparent, transparent, var(--accent));
            animation: rotateBorder 4s linear infinite;
            z-index: 0;
        }

        .request-card::after {
            content: '';
            position: absolute;
            inset: 2px;
            background: var(--card);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 18px;
            z-index: 0;
        }

        .request-card > * {
            position: relative;
            z-index: 1;
        }
        
        .icon-circle { 
            width: 70px; 
            height: 70px; 
            background: rgba(0, 229, 255, 0.1); 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0 auto 20px; 
            color: var(--accent); 
            font-size: 28px; 
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
            border: 1px solid var(--border);
        }
        
        h2 { margin: 0 0 10px; font-size: 22px; text-shadow: 0 0 8px rgba(0, 229, 255, 0.4); }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }

        .input-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 12px; color: var(--accent); margin-bottom: 8px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
        input, textarea { 
            width: 100%; 
            background: rgba(0,0,0,0.4); 
            border: 1px solid var(--glass-border); 
            border-radius: 12px; 
            padding: 14px; 
            color: white; 
            outline: none; 
            box-sizing: border-box; 
            transition: all 0.3s ease;
            font-family: inherit;
        }
        input:focus, textarea:focus {
            background: rgba(0, 229, 255, 0.05);
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }
        
        .submit-btn { 
            width: 100%; 
            padding: 15px; 
            border-radius: 12px; 
            border: none; 
            background: linear-gradient(45deg, var(--accent), #5cedff); 
            color: #050505; 
            font-weight: 900; 
            font-size: 16px; 
            cursor: pointer; 
            transition: 0.3s; 
            margin-top: 10px; 
            box-shadow: 0 8px 20px rgba(0, 229, 255, 0.4);
        }
        .submit-btn:active { transform: scale(0.96); box-shadow: 0 4px 10px rgba(0, 229, 255, 0.4); }

        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 25px;
            padding: 12px 20px;
            border-radius: 30px;
            background: rgba(37, 211, 102, 0.1);
            color: #25D366;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            border: 1px solid rgba(37, 211, 102, 0.3);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .whatsapp-btn:hover {
            background: rgba(37, 211, 102, 0.2);
            box-shadow: 0 0 15px rgba(37, 211, 102, 0.3);
        }

        /* Success Message Overlay */
        #success-ui { 
            display: none; 
            position: fixed; 
            inset: 0; 
            background: rgba(5, 5, 5, 0.9); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 100; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
        }
        .success-icon { font-size: 60px; color: var(--accent); margin-bottom: 20px; text-shadow: 0 0 20px rgba(0, 229, 255, 0.6); animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="header">
        <i class="fa-solid fa-arrow-left" onclick="history.back()"></i>
        <div style="font-weight: bold;">Request Center</div>
    </div>

    <div class="container">
        <div class="request-card">
            <div class="icon-circle"><i class="fa-solid fa-film"></i></div>
            <h2>Request Content</h2>
            <p>If we don't have it, we'll get it. Our team usually uploads requests within 24 hours.</p>

            <div class="input-group">
                <label>Movie/Series Name</label>
                <input type="text" id="movie-name" placeholder="Enter title...">
            </div>

            <div class="input-group">
                <label>Additional Notes (Optional)</label>
                <textarea id="notes" rows="3" placeholder="Season 2, Dual Audio, etc..."></textarea>
            </div>

            <button class="submit-btn" onclick="sendRequest()">Submit Request</button>

            <a href="https://wa.me/256743315877" target="_blank" class="whatsapp-btn">
                <i class="fa-brands fa-whatsapp" style="font-size: 18px;"></i>
                Contact Support
            </a>
        </div>
    </div>

    <div id="success-ui">
        <i class="fa-solid fa-circle-check success-icon"></i>
        <h2>Request Logged!</h2>
        <p>Leo has notified the admin. <br>Check back soon!</p>
        <button class="submit-btn" style="max-width: 200px;" onclick="history.back()">Go Back</button>
    </div>

<script>
    // Use the same config as your chat.html
    const FB_CONFIG = { apiKey: "AIzaSyBW6mwoDVbGn0cX7ySV49648jSrLZ_vyEQ", authDomain: "leoxtream-46cdf.firebaseapp.com", projectId: "leoxtream-46cdf", appId: "1:198227069591:web:a86310e5dc58b845abf7d2" };
    firebase.initializeApp(FB_CONFIG);
    const db = firebase.firestore();

    // Auto-fill from Leo's "Request" button
    window.onload = () => {
        const params = new URLSearchParams(window.location.search);
        if(params.has('m')) {
            document.getElementById('movie-name').value = decodeURIComponent(params.get('m'));
        }
    };

    async function sendRequest() {
        const title = document.getElementById('movie-name').value.trim();
        const notes = document.getElementById('notes').value.trim();
        const btn = document.querySelector('.submit-btn');

        if(!title) return alert("Please enter a movie name");

        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';
        btn.disabled = true;

        try {
            await db.collection("requests").add({
                movieTitle: title,
                extraNotes: notes,
                status: "pending",
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            document.getElementById('success-ui').style.display = 'flex';
        } catch (error) {
            alert("Error sending request. Check connection.");
            btn.innerHTML = 'Submit Request';
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
