<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pearlpix | Access</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #030712;
            --neon-cyan: #00f0ff;
            --glass-bg: rgba(10, 15, 30, 0.65);
            --glass-border: rgba(0, 240, 255, 0.25);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --error-red: #ff3366;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Advanced Atmospheric Glow */
        body::before {
            content: '';
            position: absolute;
            width: 200vw;
            height: 200vw;
            background: radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.08) 0%, transparent 50%);
            animation: slowDrift 15s linear infinite alternate;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes slowDrift {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.1) translate(-2%, 2%); }
        }
        /* --- Advanced Notification UI --- */
        #notification-zone {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-150%);
            z-index: 10001;
            width: 90%;
            max-width: 400px;
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            border-left: 4px solid var(--neon-cyan);
            border-radius: 4px 12px 12px 4px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 40px rgba(0, 240, 255, 0.15);
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #notification-zone.active { transform: translateX(-50%) translateY(0); }
        #notif-msg { font-size: 14px; font-weight: 600; letter-spacing: 0.5px; }

        /* --- Glassmorphism Main UI Card --- */
        .auth-card {
            width: 90%;
            max-width: 420px;
            padding: 45px 35px;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            position: relative;
            z-index: 10;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 0 20px rgba(0, 240, 255, 0.05);
            overflow: hidden;
            animation: initLoad 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        @keyframes initLoad {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Robotic Scanner Line Effect */
        .auth-card::after {
            content: '';
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 200%;
            background: linear-gradient(180deg, transparent, rgba(0, 240, 255, 0.1), transparent);
            transform: rotate(45deg);
            animation: scanLine 6s linear infinite;
            pointer-events: none;
            z-index: 1;
        }
        @keyframes scanLine {
            0% { transform: translateY(-100%) rotate(45deg); }
            100% { transform: translateY(100%) rotate(45deg); }
        }

        .logo-area { text-align: center; margin-bottom: 40px; position: relative; z-index: 2; }
        .logo-area h1 {
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 2px;
            color: transparent;
            -webkit-text-stroke: 1px var(--neon-cyan);
            background: linear-gradient(90deg, #fff, var(--neon-cyan));
            -webkit-background-clip: text;
            background-clip: text;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.4));
        }
        .logo-area p {
            font-size: 13px;
            color: var(--neon-cyan);
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .input-group { position: relative; margin-bottom: 22px; z-index: 2; }
        .input-group i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 15px;
            transition: 0.4s;
        }
        input {
            width: 100%;
            padding: 18px 20px 18px 50px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: 0.4s ease;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        input::placeholder { color: var(--text-muted); }
        input:focus {
            border-color: var(--neon-cyan);
            background: rgba(0, 240, 255, 0.05);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15), inset 0 2px 10px rgba(0,0,0,0.5);
        }
        input:focus + i, input:focus ~ i { color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan); }

        .terms-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 25px 0;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            z-index: 2;
            position: relative;
        }
        .terms-wrap input { width: 18px; height: 18px; cursor: pointer; accent-color: var(--neon-cyan); margin: 0; padding: 0; }

        .btn-action {
            width: 100%;
            padding: 18px;
            background: transparent;
            color: var(--neon-cyan);
            border: 2px solid var(--neon-cyan);
            border-radius: 14px;
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.4s;
            position: relative;
            z-index: 2;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }
        .btn-action::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 0%; height: 100%;
            background: var(--neon-cyan);
            transition: 0.4s;
            z-index: -1;
        }
        .btn-action:hover:not(:disabled)::before { width: 100%; }
        .btn-action:hover:not(:disabled) {
            color: #000;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
            transform: translateY(-2px);
        }
        .btn-action:disabled { border-color: #333; color: #555; box-shadow: none; cursor: not-allowed; }
        .btn-action:disabled::before { display: none; }

        .footer-links {
            margin-top: 35px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            justify-content: center;
            gap: 15px;
            z-index: 2;
            position: relative;
        }
        .footer-links span { color: var(--text-main); cursor: pointer; font-weight: 600; transition: 0.3s; }
        .footer-links span:hover { color: var(--neon-cyan); text-shadow: 0 0 8px var(--neon-cyan); }
        
        .hidden { display: none !important; }
        .form-container { display: flex; flex-direction: column; gap: 5px; position: relative; z-index: 2; }
    </style>
</head>
<body>

    <div id="notification-zone">
        <i id="notif-icon" class="fas fa-info-circle" style="color: var(--neon-cyan);"></i>
        <span id="notif-msg"></span>
    </div>

    <div class="auth-card" id="main-card">
        <div class="logo-area">
            <h1>Pearlpix</h1>
            <p id="view-title">Create Account</p>
        </div>

        <div class="form-container">
            <div id="signup-fields">
                <div class="input-group">
                    <input type="text" id="reg-user" placeholder="Username">
                    <i class="fa-solid fa-user"></i>
                </div>
            </div>

            <div class="input-group">
                <input type="email" id="email" placeholder="Email Address">
                <i class="fa-solid fa-envelope"></i>
            </div>
            
            <div class="input-group" id="pass-group">
                <input type="password" id="password" placeholder="Password">
                <i class="fa-solid fa-lock"></i>
            </div>

            <label class="terms-wrap" id="terms-area">
                <input type="checkbox" id="terms-check">
                <span>I agree to the terms and privacy policy</span>
            </label>

            <button class="btn-action" id="main-btn" onclick="handleProcess()" disabled>Register</button>
        </div>

        <div class="footer-links" id="signup-footer">
            <span>Already have an account?</span> 
            <span style="color: var(--neon-cyan);" onclick="switchMode('login')">Sign In</span>
        </div>

        <div class="footer-links hidden" id="login-footer">
            <span onclick="switchMode('reset')">Forgot Password?</span> 
            <span style="color: var(--neon-cyan);" onclick="switchMode('signup')">Create Account</span>
        </div>
        
        <div class="footer-links hidden" id="reset-footer">
            <span>Remembered password?</span> 
            <span style="color: var(--neon-cyan);" onclick="switchMode('login')">Sign In</span>
        </div>
    </div>
    <script>
    // Exact Firebase config from your original file
    const firebaseConfig = { 
        apiKey: "AIzaSyBW6mwoDVbGn0cX7ySV49648jSrLZ_vyEQ", 
        authDomain: "leoxtream-46cdf.firebaseapp.com", 
        projectId: "leoxtream-46cdf", 
        appId: "1:198227069591:web:a86310e5dc58b845abf7d2" 
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Auto-redirect authenticated users with storage sync check
    auth.onAuthStateChanged(user => {
        if (user) {
            const lastUserUid = localStorage.getItem('lastUserUid');
            if (lastUserUid !== user.uid) {
                localStorage.removeItem('recentlyPlayed');
                localStorage.removeItem('continueWatching');
                localStorage.removeItem('savedMovies');
                Object.keys(localStorage).forEach(key => { if (key.startsWith('resume_')) localStorage.removeItem(key); });
            }
            localStorage.setItem('lastUserUid', user.uid);
            if (!document.getElementById('main-btn').disabled) {
                window.location.href = "index.html";
            }
        }
    });

    let currentMode = 'signup';

    function showNotify(text, type='info') {
        const zone = document.getElementById('notification-zone');
        const icon = document.getElementById('notif-icon');
        
        document.getElementById('notif-msg').innerText = text;
        
        if(type === 'error') {
            zone.style.borderColor = 'var(--error-red)';
            icon.className = 'fas fa-exclamation-triangle';
            icon.style.color = 'var(--error-red)';
        } else {
            zone.style.borderColor = 'var(--neon-cyan)';
            icon.className = 'fas fa-check-circle';
            icon.style.color = 'var(--neon-cyan)';
        }
        
        zone.classList.add('active');
        setTimeout(() => zone.classList.remove('active'), 4000);
    }

    document.getElementById('terms-check').addEventListener('change', (e) => {
        if(currentMode === 'signup') {
            document.getElementById('main-btn').disabled = !e.target.checked;
        }
    });

    function switchMode(mode) {
        currentMode = mode;
        const signupFields = document.getElementById('signup-fields');
        const passGroup = document.getElementById('pass-group');
        const termsArea = document.getElementById('terms-area');
        const mainBtn = document.getElementById('main-btn');
        const title = document.getElementById('view-title');
        
        // Hide all footers
        document.getElementById('signup-footer').classList.add('hidden');
        document.getElementById('login-footer').classList.add('hidden');
        document.getElementById('reset-footer').classList.add('hidden');

        if(mode === 'signup') {
            title.innerText = "Create Account";
            signupFields.classList.remove('hidden');
            passGroup.classList.remove('hidden');
            termsArea.classList.remove('hidden');
            mainBtn.innerText = "Register";
            document.getElementById('signup-footer').classList.remove('hidden');
            mainBtn.disabled = !document.getElementById('terms-check').checked;
        } else if(mode === 'login') {
            title.innerText = "Welcome Back";
            signupFields.classList.add('hidden');
            passGroup.classList.remove('hidden');
            termsArea.classList.add('hidden');
            mainBtn.innerText = "Sign In";
            mainBtn.disabled = false;
            document.getElementById('login-footer').classList.remove('hidden');
        } else if(mode === 'reset') {
            title.innerText = "Recovery Mode";
            signupFields.classList.add('hidden');
            passGroup.classList.add('hidden');
            termsArea.classList.add('hidden');
            mainBtn.innerText = "Send Reset Email";
            mainBtn.disabled = false;
            document.getElementById('reset-footer').classList.remove('hidden');
        }
    }

    async function handleProcess() {
        const email = document.getElementById('email').value.trim();
        const pass = document.getElementById('password').value;
        const user = document.getElementById('reg-user').value.trim();
        const btn = document.getElementById('main-btn');

        if(!email) { showNotify("Please enter an email address.", "error"); return; }
        
        btn.disabled = true;
        btn.innerText = "PROCESSING...";

        try {
            if(currentMode === 'signup') {
                if(!user || !pass) throw new Error("Complete all registration fields.");
                
                // Username unique check
                const check = await db.collection("usernames").doc(user).get();
                if(check.exists) throw new Error("Username already taken.");

                const res = await auth.createUserWithEmailAndPassword(email, pass);
                
                // Set UID and wipe storage
                localStorage.removeItem('continueWatching');
                localStorage.removeItem('recentlyPlayed');
                localStorage.removeItem('savedMovies');
                Object.keys(localStorage).forEach(key => {
                    if (key.startsWith('resume_')) localStorage.removeItem(key);
                });
                localStorage.setItem('lastUserUid', res.user.uid);

                await res.user.updateProfile({ displayName: user });
                
                // Store to Firebase (Phone removed)
                await db.collection("users").doc(res.user.uid).set({
                    username: user, email: email, created: new Date()
                });
                await db.collection("usernames").doc(user).set({ uid: res.user.uid });

                showNotify("Identity created successfully!");
                setTimeout(() => window.location.href = "index.html", 1500);

            } else if(currentMode === 'login') {
                if(!pass) throw new Error("Password is required.");
                const res = await auth.signInWithEmailAndPassword(email, pass);
                
                // Set UID and wipe storage
                localStorage.removeItem('continueWatching');
                localStorage.removeItem('recentlyPlayed');
                localStorage.removeItem('savedMovies');
                Object.keys(localStorage).forEach(key => {
                    if (key.startsWith('resume_')) localStorage.removeItem(key);
                });
                localStorage.setItem('lastUserUid', res.user.uid);

                showNotify("Access granted.");
                setTimeout(() => window.location.href = "index.html", 1000);

            } else if(currentMode === 'reset') {
                // REAL WORKING FORGOT PASSWORD
                await auth.sendPasswordResetEmail(email);
                showNotify("Recovery email sent! Check your inbox.");
                setTimeout(() => switchMode('login'), 3000);
            }
        } catch(e) {
            showNotify(e.message, "error");
            btn.disabled = false;
            btn.innerText = currentMode === 'signup' ? "Register" : (currentMode === 'login' ? "Sign In" : "Send Reset Email");
        }
    }
    </script>
</body>
</html>
