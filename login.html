<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J MOVIES | Digital Access</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@18.2.1/build/css/intlTelInput.css">
    <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@18.2.1/build/js/intlTelInput.min.js"></script>

    <style>
        :root {
            --bg: #030508;
            --panel: rgba(13, 17, 23, 0.8);
            --accent: #00d4ff;
            --accent-glow: rgba(0, 212, 255, 0.3);
            --text-main: #f0f6fc;
            --text-dim: #8b949e;
            --error: #ff4b5c;
            --success: #2ea043;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }

        body {
            background: var(--bg);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(0, 212, 255, 0.07) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(0, 212, 255, 0.07) 0%, transparent 50%);
        }

        /* --- Advanced Notification UI --- */
        #notification-zone {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-120%);
            z-index: 10001;
            width: 90%;
            max-width: 380px;
            padding: 16px 20px;
            background: rgba(22, 27, 34, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 12px;
            border: 1px solid var(--accent);
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #notification-zone.active { transform: translateX(-50%) translateY(0); }
        #notif-msg { font-size: 13px; font-weight: 500; }

        /* --- Robotic Loading Features --- */
        #loader-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .loading-bar-container {
            width: 200px;
            height: 2px;
            background: rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
        }
        .loading-bar-progress {
            position: absolute;
            height: 100%;
            width: 40%;
            background: var(--accent);
            box-shadow: 0 0 15px var(--accent);
            animation: robotic-slide 2s infinite ease-in-out;
        }
        @keyframes robotic-slide {
            0% { left: -40%; }
            50% { left: 100%; }
            100% { left: -40%; }
        }
        .loading-text {
            margin-top: 20px;
            font-size: 10px;
            letter-spacing: 4px;
            color: var(--accent);
            text-transform: uppercase;
        }

        /* --- Main UI Card --- */
        .auth-card {
            width: 90%;
            max-width: 400px;
            padding: 40px;
            background: var(--panel);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            position: relative;
            z-index: 10;
            opacity: 0;
            transform: translateY(20px);
            transition: 0.8s ease;
        }
        .auth-card.active { opacity: 1; transform: translateY(0); }

        .logo-area { text-align: center; margin-bottom: 35px; }
        .logo-area h1 {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px var(--accent-glow);
        }
        .logo-area p {
            font-size: 10px;
            color: var(--accent);
            letter-spacing: 3px;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .input-group { margin-bottom: 15px; }
        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: var(--accent); background: rgba(0, 0, 0, 0.5); }

        /* Phone Input Fixes */
        .iti { width: 100%; margin-bottom: 15px; }
        .iti__country-list { background: #161b22; border: 1px solid #30363d; color: white; }

        .terms-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
            font-size: 12px;
            color: var(--text-dim);
        }
        .terms-wrap input { width: 16px; height: 16px; cursor: pointer; }

        .btn-action {
            width: 100%;
            padding: 16px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-action:disabled { opacity: 0.3; cursor: not-allowed; }

        .footer-links {
            margin-top: 25px;
            text-align: center;
            font-size: 13px;
            color: var(--text-dim);
        }
        .footer-links span { color: var(--accent); cursor: pointer; font-weight: 600; }
        
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="loader-overlay">
        <div class="loading-bar-container"><div class="loading-bar-progress"></div></div>
        <div class="loading-text" id="load-status">System Booting</div>
    </div>

    <div id="notification-zone">
        <i id="notif-icon" class="fas fa-info-circle"></i>
        <span id="notif-msg"></span>
    </div>

    <div class="auth-card" id="main-card">
        <div class="logo-area">
            <h1>J MOVIES</h1>
            <p id="view-title">Create Account</p>
        </div>

        <div id="signup-fields">
            <div class="input-group">
                <input type="text" id="reg-user" placeholder="Username">
            </div>
            <div class="input-group">
                <input type="tel" id="reg-phone">
            </div>
        </div>

        <div class="input-group">
            <input type="email" id="email" placeholder="Email Address">
        </div>
        
        <div class="input-group" id="pass-group">
            <input type="password" id="password" placeholder="Password">
        </div>

        <label class="terms-wrap" id="terms-area">
            <input type="checkbox" id="terms-check">
            <span>I agree to the terms and conditions</span>
        </label>

        <button class="btn-action" id="main-btn" onclick="handleProcess()" disabled>Register</button>

        <div class="footer-links" id="signup-footer">
            Already have an account? <span onclick="switchMode('login')">Sign In</span>
        </div>

        <div class="footer-links hidden" id="login-footer">
            <span onclick="switchMode('reset')">Reset Password</span> • <span onclick="switchMode('signup')">Create Account</span>
        </div>
        
        <div class="footer-links hidden" id="reset-footer">
            Remembered password? <span onclick="switchMode('login')">Sign In</span>
        </div>
    </div>
    <script>
    // Exact Firebase config from your original file
    const firebaseConfig = { 
        apiKey: "AIzaSyBW6mwoDVbGn0cX7ySV49648jSrLZ_vyEQ", 
        authDomain: "leoxtream-46cdf.firebaseapp.com", 
        projectId: "leoxtream-46cdf", 
        appId: "1:198227069591:web:a86310e5dc58b845abf7d2" 
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Auto-redirect authenticated users with storage sync check
    auth.onAuthStateChanged(user => {
        if (user) {
            const lastUserUid = localStorage.getItem('lastUserUid');
            if (lastUserUid !== user.uid) {
                localStorage.removeItem('recentlyPlayed');
                localStorage.removeItem('continueWatching');
                localStorage.removeItem('savedMovies');
                Object.keys(localStorage).forEach(key => { if (key.startsWith('resume_')) localStorage.removeItem(key); });
            }
            localStorage.setItem('lastUserUid', user.uid);
            if (!document.getElementById('main-btn').disabled) {
                window.location.href = "index.html";
            }
        }
    });

    let currentMode = 'signup';
    let phoneInput;
    function showNotify(text, type='info') {
        const zone = document.getElementById('notification-zone');
        document.getElementById('notif-msg').innerText = text;
        zone.style.borderColor = type === 'error' ? 'var(--error)' : 'var(--accent)';
        zone.classList.add('active');
        setTimeout(() => zone.classList.remove('active'), 4000);
    }

    window.onload = () => {
        // Uganda as default country code
        phoneInput = window.intlTelInput(document.querySelector("#reg-phone"), {
            initialCountry: "ug",
            separateDialCode: true,
            utilsScript: "https://cdn.jsdelivr.net/npm/intl-tel-input@18.2.1/build/js/utils.js",
        });

        // Robotic Loading Sequence
        const status = document.getElementById('load-status');
        setTimeout(() => status.innerText = "Securing Connection...", 1000);
        setTimeout(() => status.innerText = "Loading J MOVIES UI...", 2000);
        setTimeout(() => {
            document.getElementById('loader-overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('loader-overlay').style.display = 'none';
                document.getElementById('main-card').classList.add('active');
            }, 500);
        }, 3000);
    };

    document.getElementById('terms-check').addEventListener('change', (e) => {
        document.getElementById('main-btn').disabled = !e.target.checked;
    });

    function switchMode(mode) {
        currentMode = mode;
        const signupFields = document.getElementById('signup-fields');
        const passGroup = document.getElementById('pass-group');
        const termsArea = document.getElementById('terms-area');
        const mainBtn = document.getElementById('main-btn');
        const title = document.getElementById('view-title');
        
        // Hide all footers
        document.getElementById('signup-footer').classList.add('hidden');
        document.getElementById('login-footer').classList.add('hidden');
        document.getElementById('reset-footer').classList.add('hidden');

        if(mode === 'signup') {
            title.innerText = "Create Account";
            signupFields.classList.remove('hidden');
            passGroup.classList.remove('hidden');
            termsArea.classList.remove('hidden');
            mainBtn.innerText = "Register";
            document.getElementById('signup-footer').classList.remove('hidden');
            mainBtn.disabled = !document.getElementById('terms-check').checked;
        } else if(mode === 'login') {
            title.innerText = "Sign In";
            signupFields.classList.add('hidden');
            passGroup.classList.remove('hidden');
            termsArea.classList.add('hidden');
            mainBtn.innerText = "Sign In";
            mainBtn.disabled = false;
            document.getElementById('login-footer').classList.remove('hidden');
        } else if(mode === 'reset') {
            title.innerText = "Recovery Mode";
            signupFields.classList.add('hidden');
            passGroup.classList.add('hidden');
            termsArea.classList.add('hidden');
            mainBtn.innerText = "Send Reset Email";
            mainBtn.disabled = false;
            document.getElementById('reset-footer').classList.remove('hidden');
        }
    }
    async function handleProcess() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        const user = document.getElementById('reg-user').value;
        const btn = document.getElementById('main-btn');

        if(!email) { showNotify("Please enter an email.", "error"); return; }
        
        btn.disabled = true;
        btn.innerText = "PROCESSING...";

        try {
            if(currentMode === 'signup') {
                const phone = phoneInput.getNumber();
                if(!user || !phone || !pass) throw new Error("Complete all registration fields.");
                
                // Username unique check
                const check = await db.collection("usernames").doc(user).get();
                if(check.exists) throw new Error("Username already taken.");

                const res = await auth.createUserWithEmailAndPassword(email, pass);
                
                // Set UID and wipe storage
                localStorage.removeItem('continueWatching');
                localStorage.removeItem('recentlyPlayed');
                localStorage.removeItem('savedMovies');
                Object.keys(localStorage).forEach(key => {
                    if (key.startsWith('resume_')) localStorage.removeItem(key);
                });
                localStorage.setItem('lastUserUid', res.user.uid);

                await res.user.updateProfile({ displayName: user });
                
                // Store to Firebase
                await db.collection("users").doc(res.user.uid).set({
                    username: user, phone: phone, email: email, created: new Date()
                });
                await db.collection("usernames").doc(user).set({ uid: res.user.uid });

                showNotify("Identity created successfully!");
                setTimeout(() => window.location.href = "index.html", 1500);

            } else if(currentMode === 'login') {
                if(!pass) throw new Error("Password required.");
                const res = await auth.signInWithEmailAndPassword(email, pass);
                
                // Set UID and wipe storage
                localStorage.removeItem('continueWatching');
                localStorage.removeItem('recentlyPlayed');
                localStorage.removeItem('savedMovies');
                Object.keys(localStorage).forEach(key => {
                    if (key.startsWith('resume_')) localStorage.removeItem(key);
                });
                localStorage.setItem('lastUserUid', res.user.uid);

                showNotify("Access granted.");
                setTimeout(() => window.location.href = "index.html", 1000);

            } else if(currentMode === 'reset') {
                // REAL WORKING FORGOT PASSWORD
                await auth.sendPasswordResetEmail(email);
                showNotify("Recovery email sent! Check your inbox.");
                setTimeout(() => switchMode('login'), 3000);
            }
        } catch(e) {
            showNotify(e.message, "error");
            btn.disabled = false;
            btn.innerText = currentMode === 'signup' ? "Register" : (currentMode === 'login' ? "Sign In" : "Send Reset Email");
        }
    }
</script>
</body>
</html>
