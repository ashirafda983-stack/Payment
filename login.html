<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pearlpix | Access</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --bg: #050505;
            --accent: #00e5ff;
            --glass: rgba(5, 5, 5, 0.6);
            --border: rgba(0, 229, 255, 0.3);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --error: #ff4b5c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Advanced Background Glow */
        body::before {
            content: '';
            position: absolute;
            width: 150vw;
            height: 150vw;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.05) 0%, transparent 60%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            animation: pulseBg 8s infinite alternate;
        }

        @keyframes pulseBg {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        /* --- Advanced Notification UI --- */
        #notification-zone {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-150%);
            z-index: 10001;
            width: 90%;
            max-width: 400px;
            padding: 16px 20px;
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid var(--accent);
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0, 229, 255, 0.2);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #notification-zone.active { transform: translateX(-50%) translateY(0); }
        #notif-msg { font-size: 14px; font-weight: 600; }

        /* --- Minimalist Loader --- */
        #loader-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }
        .player-loader-circle {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(255,255,255,0.05);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spinLoader 1s linear infinite;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
        }
        @keyframes spinLoader { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .loading-text {
            margin-top: 25px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 3px;
            color: var(--accent);
            text-transform: uppercase;
        }

        /* --- Glassmorphism Main UI Card --- */
        .auth-card {
            width: 90%;
            max-width: 420px;
            padding: 40px 30px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            position: relative;
            z-index: 10;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
        }
        .auth-card.active { opacity: 1; transform: translateY(0); }

        .logo-area { text-align: center; margin-bottom: 35px; }
        .logo-area h1 {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #fff;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
        }
        .logo-area p {
            font-size: 12px;
            color: var(--accent);
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .input-group { 
            position: relative; 
            margin-bottom: 20px; 
            transition: all 0.3s ease;
        }
        .input-group i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            font-size: 14px;
            transition: 0.3s;
        }
        input {
            width: 100%;
            padding: 16px 16px 16px 45px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }
        input::placeholder { color: var(--text-dim); }
        input:focus { 
            border-color: var(--accent); 
            background: rgba(0, 229, 255, 0.03); 
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.1);
        }
        input:focus + i, input:focus ~ i { color: var(--accent); }

        .terms-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 25px 0;
            font-size: 12px;
            color: var(--text-dim);
            cursor: pointer;
        }
        .terms-wrap input { 
            width: 18px; 
            height: 18px; 
            cursor: pointer; 
            accent-color: var(--accent); 
            margin: 0;
            padding: 0;
        }

        .btn-action {
            width: 100%;
            padding: 16px;
            background: var(--accent);
            color: #050505;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 20px rgba(0, 229, 255, 0.3);
        }
        .btn-action:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 229, 255, 0.5);
        }
        .btn-action:active:not(:disabled) {
            transform: translateY(1px);
        }
        .btn-action:disabled { 
            background: #222; 
            color: #555; 
            box-shadow: none; 
            cursor: not-allowed; 
        }

        .footer-links {
            margin-top: 30px;
            text-align: center;
            font-size: 13px;
            color: var(--text-dim);
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .footer-links span { 
            color: var(--text-main); 
            cursor: pointer; 
            font-weight: 600; 
            transition: 0.2s; 
        }
        .footer-links span:hover { color: var(--accent); }
        
        .hidden { display: none !important; }
        
        /* Smooth height transition for form switching */
        .form-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
    </style>
</head>
<body>

    <div id="loader-overlay">
        <div class="player-loader-circle"></div>
        <div class="loading-text" id="load-status">System Booting</div>
    </div>

    <div id="notification-zone">
        <i id="notif-icon" class="fas fa-info-circle" style="color: var(--accent);"></i>
        <span id="notif-msg"></span>
    </div>

    <div class="auth-card" id="main-card">
        <div class="logo-area">
            <h1>Pearlpix</h1>
            <p id="view-title">Create Account</p>
        </div>

        <div class="form-container">
            <div id="signup-fields">
                <div class="input-group">
                    <input type="text" id="reg-user" placeholder="Username">
                    <i class="fa-solid fa-user"></i>
                </div>
            </div>

            <div class="input-group">
                <input type="email" id="email" placeholder="Email Address">
                <i class="fa-solid fa-envelope"></i>
            </div>
            
            <div class="input-group" id="pass-group">
                <input type="password" id="password" placeholder="Password">
                <i class="fa-solid fa-lock"></i>
            </div>

            <label class="terms-wrap" id="terms-area">
                <input type="checkbox" id="terms-check">
                <span>I agree to the terms and privacy policy</span>
            </label>

            <button class="btn-action" id="main-btn" onclick="handleProcess()" disabled>Register</button>
        </div>

        <div class="footer-links" id="signup-footer">
            <span>Already have an account?</span> 
            <span style="color: var(--accent);" onclick="switchMode('login')">Sign In</span>
        </div>

        <div class="footer-links hidden" id="login-footer">
            <span onclick="switchMode('reset')">Forgot Password?</span> 
            <span style="color: var(--accent);" onclick="switchMode('signup')">Create Account</span>
        </div>
        
        <div class="footer-links hidden" id="reset-footer">
            <span>Remembered password?</span> 
            <span style="color: var(--accent);" onclick="switchMode('login')">Sign In</span>
        </div>
    </div>

    <script>
    // Exact Firebase config from your original file
    const firebaseConfig = { 
        apiKey: "AIzaSyBW6mwoDVbGn0cX7ySV49648jSrLZ_vyEQ", 
        authDomain: "leoxtream-46cdf.firebaseapp.com", 
        projectId: "leoxtream-46cdf", 
        appId: "1:198227069591:web:a86310e5dc58b845abf7d2" 
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Auto-redirect authenticated users with storage sync check
    auth.onAuthStateChanged(user => {
        if (user) {
            const lastUserUid = localStorage.getItem('lastUserUid');
            if (lastUserUid !== user.uid) {
                localStorage.removeItem('recentlyPlayed');
                localStorage.removeItem('continueWatching');
                localStorage.removeItem('savedMovies');
                Object.keys(localStorage).forEach(key => { if (key.startsWith('resume_')) localStorage.removeItem(key); });
            }
            localStorage.setItem('lastUserUid', user.uid);
            if (!document.getElementById('main-btn').disabled) {
                window.location.href = "index.html";
            }
        }
    });

    let currentMode = 'signup';

    function showNotify(text, type='info') {
        const zone = document.getElementById('notification-zone');
        const icon = document.getElementById('notif-icon');
        
        document.getElementById('notif-msg').innerText = text;
        
        if(type === 'error') {
            zone.style.borderColor = 'var(--error)';
            icon.className = 'fas fa-exclamation-triangle';
            icon.style.color = 'var(--error)';
        } else {
            zone.style.borderColor = 'var(--accent)';
            icon.className = 'fas fa-check-circle';
            icon.style.color = 'var(--accent)';
        }
        
        zone.classList.add('active');
        setTimeout(() => zone.classList.remove('active'), 4000);
    }

    window.onload = () => {
        // Futuristic Loading Sequence
        const status = document.getElementById('load-status');
        setTimeout(() => status.innerText = "Securing Connection...", 800);
        setTimeout(() => status.innerText = "Loading Pearlpix UI...", 1600);
        setTimeout(() => {
            document.getElementById('loader-overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('loader-overlay').style.display = 'none';
                document.getElementById('main-card').classList.add('active');
            }, 500);
        }, 2500);
    };

    document.getElementById('terms-check').addEventListener('change', (e) => {
        if(currentMode === 'signup') {
            document.getElementById('main-btn').disabled = !e.target.checked;
        }
    });

    function switchMode(mode) {
        currentMode = mode;
        const signupFields = document.getElementById('signup-fields');
        const passGroup = document.getElementById('pass-group');
        const termsArea = document.getElementById('terms-area');
        const mainBtn = document.getElementById('main-btn');
        const title = document.getElementById('view-title');
        
        // Hide all footers
        document.getElementById('signup-footer').classList.add('hidden');
        document.getElementById('login-footer').classList.add('hidden');
        document.getElementById('reset-footer').classList.add('hidden');

        if(mode === 'signup') {
            title.innerText = "Create Account";
            signupFields.classList.remove('hidden');
            passGroup.classList.remove('hidden');
            termsArea.classList.remove('hidden');
            mainBtn.innerText = "Register";
            document.getElementById('signup-footer').classList.remove('hidden');
            mainBtn.disabled = !document.getElementById('terms-check').checked;
        } else if(mode === 'login') {
            title.innerText = "Welcome Back";
            signupFields.classList.add('hidden');
            passGroup.classList.remove('hidden');
            termsArea.classList.add('hidden');
            mainBtn.innerText = "Sign In";
            mainBtn.disabled = false;
            document.getElementById('login-footer').classList.remove('hidden');
        } else if(mode === 'reset') {
            title.innerText = "Recovery Mode";
            signupFields.classList.add('hidden');
            passGroup.classList.add('hidden');
            termsArea.classList.add('hidden');
            mainBtn.innerText = "Send Reset Email";
            mainBtn.disabled = false;
            document.getElementById('reset-footer').classList.remove('hidden');
        }
    }

    async function handleProcess() {
        const email = document.getElementById('email').value.trim();
        const pass = document.getElementById('password').value;
        const user = document.getElementById('reg-user').value.trim();
        const btn = document.getElementById('main-btn');

        if(!email) { showNotify("Please enter an email address.", "error"); return; }
        
        btn.disabled = true;
        btn.innerText = "PROCESSING...";

        try {
            if(currentMode === 'signup') {
                if(!user || !pass) throw new Error("Complete all registration fields.");
                
                // Username unique check
                const check = await db.collection("usernames").doc(user).get();
                if(check.exists) throw new Error("Username already taken.");

                const res = await auth.createUserWithEmailAndPassword(email, pass);
                
                // Set UID and wipe storage
                localStorage.removeItem('continueWatching');
                localStorage.removeItem('recentlyPlayed');
                localStorage.removeItem('savedMovies');
                Object.keys(localStorage).forEach(key => {
                    if (key.startsWith('resume_')) localStorage.removeItem(key);
                });
                localStorage.setItem('lastUserUid', res.user.uid);

                await res.user.updateProfile({ displayName: user });
                
                // Store to Firebase (Phone removed)
                await db.collection("users").doc(res.user.uid).set({
                    username: user, email: email, created: new Date()
                });
                await db.collection("usernames").doc(user).set({ uid: res.user.uid });

                showNotify("Identity created successfully!");
                setTimeout(() => window.location.href = "index.html", 1500);

            } else if(currentMode === 'login') {
                if(!pass) throw new Error("Password is required.");
                const res = await auth.signInWithEmailAndPassword(email, pass);
                
                // Set UID and wipe storage
                localStorage.removeItem('continueWatching');
                localStorage.removeItem('recentlyPlayed');
                localStorage.removeItem('savedMovies');
                Object.keys(localStorage).forEach(key => {
                    if (key.startsWith('resume_')) localStorage.removeItem(key);
                });
                localStorage.setItem('lastUserUid', res.user.uid);

                showNotify("Access granted.");
                setTimeout(() => window.location.href = "index.html", 1000);

            } else if(currentMode === 'reset') {
                // REAL WORKING FORGOT PASSWORD
                await auth.sendPasswordResetEmail(email);
                showNotify("Recovery email sent! Check your inbox.");
                setTimeout(() => switchMode('login'), 3000);
            }
        } catch(e) {
            showNotify(e.message, "error");
            btn.disabled = false;
            btn.innerText = currentMode === 'signup' ? "Register" : (currentMode === 'login' ? "Sign In" : "Send Reset Email");
        }
    }
    </script>
</body>
</html>
